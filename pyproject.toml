[project]
name = "financial-mcp"
version = "0.1.0"
description = "MCP server for querying personal financial transactions in Elasticsearch"
requires-python = ">=3.10"
dependencies = [
    "elasticsearch>=8.0.0,<9.0.0",
    "mcp[cli]>=1.26.0",
    "pydantic>=2.12.5",
    "pandas>=2.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
